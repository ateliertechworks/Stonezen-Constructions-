server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The whole app is client-side routed: every unknown path is index.html,
  # otherwise a refresh on /invoices/INV-2026-27-001/edit would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Vite fingerprints these filenames, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy leaves clients on old assets.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The app talks to nothing off-origin except the Google Fonts stylesheet.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
